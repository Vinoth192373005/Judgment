server.port=${PORT:8080}

# Spring Application Name
spring.application.name=judgment-ai-system

# Supabase API Configuration (Optional)
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:${SUPABASE_ANON_KEY:${SUPABASE_PUBLISHABLE_KEY:}}}

# Database Configuration (Supabase PostgreSQL / JDBC)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:legaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Explicit JPA properties to ensure Hibernate 6 never fails dialect resolution
spring.jpa.properties.jakarta.persistence.jdbc.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:legaldb}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP Connection Pool Settings for Supabase & Cloud DBs
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging Configuration
logging.level.com.legalai=INFO
logging.level.org.springframework.web=INFO
